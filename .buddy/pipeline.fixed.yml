- pipeline: ffinance
  name: Pipeline 2
  refs:
  - refs/heads/replit-agent
  loop:
  - asw
  always_from_scratch: true
  auto_clear_cache: true
  fetch_lfs: true
  fail_on_prepare_env_warning: true
  description_required: true
  events:
  - type: WEBHOOK
    totp: true
  docker_build_cache: WORKSPACE
  actions:
  - action: npm run test
    type: BUILD
    commands: |-
      export METEOR_ALLOW_SUPERUSER="true"
      npm install
      npm run test
    setup_commands: |-
      apt-get update && apt-get install -y curl
      curl https://install.meteor.com -k | sh
    shell: BASH
    docker_image_name: library/node
    docker_image_tag: 24
